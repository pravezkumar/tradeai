services:
  - type: web
    runtime: static
    name: tradeai-frontend
    buildCommand: echo "Static frontend - no build required"
    staticPublishPath: .
    autoDeployTrigger: commit

  - type: web
    runtime: python
    name: tradeai-api-pgvr
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tradeai-postgres
          property: connectionString
      - key: TRADEAI_ENV
        value: development
      - key: TRADEAI_QUALIFIED_THRESHOLD
        value: "60"
      - key: TRADEAI_OTP_TTL_MINUTES
        value: "10"
      - key: TRADEAI_CORS_ORIGINS
        value: https://tradeai-pgvr.onrender.com
      - key: TRADEAI_AI_MODE
        value: auto
      - key: TRADEAI_OPENAI_MODEL
        value: gpt-5
      - key: OPENAI_API_KEY
        sync: false
      - key: TRADEAI_WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: TRADEAI_WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: TRADEAI_WA_OTP_TEMPLATE
        sync: false
      - key: TRADEAI_WA_RFQ_TEMPLATE
        sync: false
      - key: TRADEAI_WA_VERIFY_TOKEN
        sync: false

databases:
  - name: tradeai-postgres
    databaseName: tradeai
    user: tradeai
